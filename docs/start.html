<script>
(function(){
  var root=document.querySelector('[data-dynamic-ui-widget][data-template="password-onboarding-full"]');
  if(!root||root.dataset.mounted) return;
  root.dataset.mounted="true";
  var pages=Array.prototype.slice.call(root.querySelectorAll('.page'));
  var dots=Array.prototype.slice.call(root.querySelectorAll('.dot'));
  var next=root.querySelector('#ob-next');
  var cur=0;
  function show(i){
    if(i<0)i=0; if(i>pages.length-1)i=pages.length-1;
    cur=i;
    pages.forEach(function(p,idx){p.classList.toggle('on',idx===i);});
    dots.forEach(function(d,idx){d.classList.toggle('on',idx===i);});
    if(cur===pages.length-1){
      next.classList.remove('arrow');
      next.textContent='开始使用';
      revealCta();
    }else{
      next.classList.add('arrow');
      next.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>';
    }
  }
  function revealCta(){
    var cta=document.getElementById('cta');
    if(!cta.classList.contains('show')){
      cta.classList.add('show');
      setTimeout(function(){cta.scrollIntoView({behavior:'smooth'});},80);
    }
  }
  next.addEventListener('click',function(){
    if(cur===pages.length-1){
      revealCta();
      return;
    }
    show(cur+1);
  });
  dots.forEach(function(d){d.addEventListener('click',function(){show(dots.indexOf(d));});});
})();
</script>
